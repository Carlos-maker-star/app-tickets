# Blueprint de Render: New > Blueprint > este repositorio.
# Los secretos (sync: false) se piden en el panel al crear el servicio; nunca van al repo.
services:
  - type: web
    name: app-tickets-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v3/api-docs
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: "120"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_NOMBRE
        value: Administrador
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
